[package]
name = "rustvecdb"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web framework
actix-web = "4.4"
actix-rt = "2.9"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async
tokio = { version = "1.35", features = ["full"] }

# UUID generation
uuid = { version = "1.6", features = ["v4", "serde"] }

# Logging
env_logger = "0.11"
log = "0.4"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Linear algebra
nalgebra = "0.32"

[dev-dependencies]
reqwest = { version = "0.11", features = ["json"] }

